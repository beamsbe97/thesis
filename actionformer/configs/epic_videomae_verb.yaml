dataset_name: epic
train_split: ['training']
val_split: ['validation']
dataset: {
  json_file: ./data/epic_kitchens/annotations/epic_kitchens_100_verb.json,
  # OpenTAD release: VideoMAE-L-16x4x1, EPIC-finetuned on verbs,
  # 16-frame clips / stride 8 @ 30fps (2x SlowFast density), (T, 1024) .npy
  feat_folder: ./data/epic_kitchens/features_videomae_verb/videomae-large_ft_verb_16x4x1_img224_stride8_len16_interval1_epic_verb,
  file_prefix: ~,
  file_ext: .npy,
  num_classes: 97,
  input_dim: 1024,
  feat_stride: 8,
  num_frames: 16,
  default_fps: 30,
  trunc_thresh: 0.3,
  crop_ratio: [0.9, 1.0],
  # 2x the SlowFast length, i.e. the same temporal span (~41 min)
  max_seq_len: 4608,
}
model: {
  regression_range: [[0, 4], [2, 8], [4, 16], [8, 32], [16, 64], [32, 10000]],
  fpn_type: identity,
  max_buffer_len_factor: 4.0,
  n_mha_win_size: 9,
}
opt: {
  learning_rate: 0.0001,
  epochs: 16,
  weight_decay: 0.05,
}
loader: {
  batch_size: 2,
}
train_cfg: {
  init_loss_norm: 250,
  clip_grad_l2norm: 1.0,
  cls_prior_prob: 0.01,
  center_sample: radius,
  center_sample_radius: 1.5,
}
test_cfg: {
  pre_nms_topk: 5000,
  max_seg_num: 2000,
  min_score: 0.001,
  nms_sigma : 0.4,
  multiclass_nms: True
}
output_folder: ./ckpt/
